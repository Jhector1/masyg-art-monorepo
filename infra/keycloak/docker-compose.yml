services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: keycloak
    command:
      - start
      # dev only (remove later):
      - --spi-theme-cache-themes=false
      - --spi-theme-cache-templates=false
      # optional once stable:
      # - --optimized
    networks:
      - keycloak_default
      - public
    volumes:
      - ./themes:/opt/keycloak/themes:ro
    environment:
      # Admin user for Keycloak UI
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}

      # Behind reverse proxy (Caddy) — Keycloak 26 hostname v2 style
      # IMPORTANT: hostname only (no https://)
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: accounts.ziledigital.com
      KC_HOSTNAME_STRICT: "true"
      KC_HOSTNAME_STRICT_HTTPS: "true"

      # Keycloak runs HTTP internally; proxy terminates HTTPS
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: "8080"

      # Database
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}

      # Optional but useful
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"

      # (Optional) If you want logs more verbose while debugging:
      # KC_LOG_LEVEL: INFO
      # KC_LOG_CONSOLE_OUTPUT: default

    depends_on:
      - keycloak-db
    ports:
      # Host:8081 -> Container:8080 (Caddy can hit the container via docker network too)
      - "8081:8080"
    restart: unless-stopped

  keycloak-db:
    image: postgres:16
    container_name: keycloak-db
    networks:
      - keycloak_default
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    volumes:
      - keycloak_pg:/var/lib/postgresql/data
    restart: unless-stopped

networks:
  keycloak_default: {}
  public:
    external: true

volumes:
  keycloak_pg: {}
