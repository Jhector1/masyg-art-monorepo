services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command:
      - start
      # dev only (remove later):
      - --spi-theme-cache-themes=false
      - --spi-theme-cache-templates=false
      # (optional once built)
      # - --optimized
    networks:
      - keycloak_default
      - public
    volumes:
      - ./themes:/opt/keycloak/themes:ro
    environment:
      # Admin user for Keycloak UI
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}

      # Behind reverse proxy (Caddy) — Keycloak 26 hostname v2 style
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: https://accounts.ziledigital.com
      KC_HOSTNAME_STRICT: "true"

      # Keycloak runs HTTP internally, proxy terminates HTTPS
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: "8080"

      # Database
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}

      # Optional
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"

    depends_on:
      - keycloak-db
    ports:
      - "8081:8080" # Keycloak internal http; Caddy hits this
    restart: unless-stopped

  keycloak-db:
    image: postgres:16
    networks:
      - keycloak_default
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    volumes:
      - keycloak_pg:/var/lib/postgresql/data
    restart: unless-stopped

networks:
  keycloak_default: {}
  public:
    external: true

volumes:
  keycloak_pg: {}
